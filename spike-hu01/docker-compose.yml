services:
  client:
    build: ./client
    ports:
      - "4200:4200"
    volumes:
      - ./client:/app
      - /app/node_modules
  agent:
    build: ./agent
    env_file: .env
    depends_on:
      - whisper
    volumes:
      - ./agent:/app
  whisper:
    image: ghcr.io/speaches-ai/speaches@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    ports:
      - "8000:8000"
    environment:
      WHISPER__TTL: "-1"
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub

volumes:
  hf-hub-cache:
