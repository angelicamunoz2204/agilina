services:
  client:
    build: ./client
    ports:
      - "4200:4200"
    volumes:
      - ./client:/app
      - /app/node_modules
  agent:
    build: ./agent
    env_file: .env
    depends_on:
      whisper-warmup:
        condition: service_completed_successfully
    volumes:
      - ./agent:/app
  whisper:
    # speaches 0.8.3-cpu (era latest-cpu al fijarlo); /openapi.json reporta v0.8.2.
    image: ghcr.io/speaches-ai/speaches@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    ports:
      - "8000:8000"
    environment:
      WHISPER__TTL: "-1"
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
  whisper-warmup:
    image: curlimages/curl:latest
    depends_on:
      - whisper
    volumes:
      - ./whisper/warmup.wav:/warmup.wav:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        until curl -sf -o /dev/null http://whisper:8000/v1/models; do sleep 1; done
        # speaches no descarga modelos solo; si ya está descargado, responde 200 igual.
        curl -sf -X POST http://whisper:8000/v1/models/${WHISPER_MODEL}
        echo
        curl -sf http://whisper:8000/v1/audio/transcriptions -F file=@/warmup.wav -F model=${WHISPER_MODEL}
    restart: "no"

volumes:
  hf-hub-cache:
