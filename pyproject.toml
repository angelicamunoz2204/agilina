# ============================================================================
# Root of the Agilina Python workspace.
# Not an installable package: it only groups the four workspace members and
# concentrates the tool configuration so there is a single one.
# ============================================================================
[project]
name = "agilina"
version = "0.1.0"
description = "Virtual Scrum Master that facilitates the daily stand-up by voice"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "api", "agent", "stt"]

[tool.uv.sources]
agilina-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.14,<0.15",  # same version pinned by .pre-commit-config.yaml
    "mypy>=1.13",
    "import-linter>=2.1",
    "httpx>=0.27",
    "pre-commit>=3.8",
]

# ------------------------------------------------------------------ Ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["shared/src", "api/src", "agent/src", "stt/src"]
extend-exclude = ["api/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit: credentials and unsafe calls
    "ASYNC",
]
ignore = [
    "S101",  # assert: it is the normal pytest mechanism
]

[tool.ruff.lint.flake8-bugbear]
# Declaring dependencies in the default value is the FastAPI pattern, not an
# oversight: without this, B008 flags every Form, Depends or Query of the project.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["agilina_agent", "agilina_api", "agilina_shared", "agilina_stt"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["shared/tests", "api/tests", "agent/tests", "stt/tests"]
pythonpath = ["shared/src", "api/src", "agent/src", "stt/src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m 'not integration'"
markers = ["integration: needs a real PostgreSQL (make test-integration)"]

# -------------------------------------------------------------- coverage ----
[tool.coverage.run]
branch = true
source = ["shared/src", "api/src", "agent/src", "stt/src"]
omit = ["*/tests/*", "api/migrations/*"]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',  # the body of a Protocol method
    ': \.\.\.$',
]

# ------------------------------------------------------------------ mypy ----
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["shared/src", "api/src", "agent/src", "stt/src"]
explicit_package_bases = true
namespace_packages = true
exclude = ["/tests/", "/migrations/"]

[[tool.mypy.overrides]]
# Third-party libraries without type information.
module = ["livekit.*", "apscheduler.*", "faster_whisper.*"]
ignore_missing_imports = true

# --------------------------------------------------------- import-linter ----
# Architecture rules (docs/adr/0020): dependencies point inward and bounded
# contexts do not reach into each other.
[tool.importlinter]
root_packages = ["agilina_api", "agilina_agent", "agilina_stt", "agilina_shared"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "API: layers of each context"
type = "layers"
# Parentheses mark optional layers: a context only creates the ones it needs.
layers = ["(presentation) | (infrastructure)", "(application)", "(domain)"]
containers = [
    "agilina_api.shared",
    "agilina_api.ceremonies",
    "agilina_api.identity",
    "agilina_api.teams",
]

[[tool.importlinter.contracts]]
name = "API: bootstrap on top, contexts independent of each other, shared and the kernel below"
type = "layers"
# "a | b" means siblings: a context cannot import another one (AD-21).
layers = [
    "agilina_api.bootstrap",
    "agilina_api.ceremonies | agilina_api.identity | agilina_api.teams",
    "agilina_api.shared",
    "agilina_api.shared_kernel",
]

[[tool.importlinter.contracts]]
name = "API: the domain does not know frameworks"
type = "forbidden"
source_modules = [
    "agilina_api.shared_kernel",
    "agilina_api.identity.domain",
    "agilina_api.teams.domain",
]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic", "httpx", "apscheduler"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Agent: layers"
type = "layers"
layers = ["main", "presentation | infrastructure", "application", "domain"]
containers = ["agilina_agent"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Agent: the domain does not know frameworks"
type = "forbidden"
source_modules = ["agilina_agent.domain"]
forbidden_modules = ["livekit", "httpx", "fastapi", "sqlalchemy"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "STT: layers"
type = "layers"
layers = ["main", "presentation | infrastructure", "application", "domain"]
containers = ["agilina_stt"]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Shared contract does not depend on any deployable"
type = "forbidden"
source_modules = ["agilina_shared"]
forbidden_modules = ["agilina_api", "agilina_agent", "agilina_stt"]
