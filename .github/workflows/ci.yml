# Verificación automática de Agilina.
#
# Un pull request con la compilación o las pruebas en rojo no se revisa, así que
# esto corre antes que cualquier persona. El objetivo declarado en la
# arquitectura es menos de diez minutos para los cuatro componentes.
name: Verificación

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  convenciones:
    name: Convenciones de commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar los commits del pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: ./.github/scripts/validar-commits.sh "$BASE" "$CABEZA"

  python:
    name: API, worker y transcripción
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --all-packages --all-groups

      - name: Formato
        run: uv run ruff format --check .

      - name: Análisis estático
        run: uv run ruff check --output-format=github .

      - name: Pruebas con cobertura
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Publicar la cobertura en el resumen
        if: always()
        run: |
          {
            echo "### Cobertura de Python"
            echo ""
            uv run coverage report --format=markdown || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-python
          path: coverage.xml
          if-no-files-found: ignore

  web:
    name: Aplicación web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No hay package-lock.json todavía; commitéalo tras el primer npm install."
            npm install
          fi

      - name: Análisis estático
        run: npm run lint

      - name: Compilación
        run: npm run build

      - name: Pruebas con cobertura
        run: npm run test:ci

      - name: Guardar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-web
          path: web/coverage
          if-no-files-found: ignore

  verificacion:
    name: Verificación completa
    runs-on: ubuntu-latest
    needs: [convenciones, python, web]
    if: always()
    steps:
      - name: Revisar el resultado de los demás trabajos
        run: |
          echo "convenciones: ${{ needs.convenciones.result }}"
          echo "python:       ${{ needs.python.result }}"
          echo "web:          ${{ needs.web.result }}"
          for resultado in "${{ needs.convenciones.result }}" "${{ needs.python.result }}" "${{ needs.web.result }}"; do
            case "$resultado" in
              success|skipped) ;;
              *) echo "::error::La verificación no pasó."; exit 1 ;;
            esac
          done
          echo "Verificación en verde."
