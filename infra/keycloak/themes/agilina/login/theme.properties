# The login theme of Agilina. `base` brings the templates of every Keycloak page without any
# style; ours (template.ftl) wraps all of them in the product's look, built with Tailwind from
# the web's tokens (infra/keycloak/theme.css).
parent=base
import=common/keycloak
styles=css/agilina.css
locales=es,en
