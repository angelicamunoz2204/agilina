# Agilina local environment: everything runs in containers, nothing is installed
# on the host but Docker and make.
#
#   default services   postgres, pgadmin, keycloak, mailpit, api, web   (`make up`)
#   profile `voice`    stt, agent                              (`make stt`, `make agent`)
#   profile `tools`    tools, web-test: one-off containers for tests and checks
#
# The source is bind-mounted into the dev containers, so editing code reloads the
# service without rebuilding. Production images are the `api` and `prod` targets
# of the Dockerfiles (HU-38).
name: agilina

# Shared by every Python dev service: same image, the repository mounted at /app and
# the host user, so the files they create (caches, migrations) belong to you.
x-python-dev: &python-dev
  build:
    context: ..
    dockerfile: infra/docker/python.Dockerfile
    target: dev
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  env_file: ../.env
  volumes:
    - ..:/app

services:
  postgres:
    image: postgres:16-alpine
    container_name: agilina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agilina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing in .env; run make env}
      POSTGRES_DB: ${POSTGRES_DB:-agilina}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agilina} -d ${POSTGRES_DB:-agilina}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: agilina-keycloak
    restart: unless-stopped
    # start-dev stores in its own embedded database: it does not depend on
    # Postgres. The cloud deployment will use it (HU-38).
    command: ["start-dev", "--import-realm"]
    environment:
      # Keycloak admin credentials: they come from .env, never from the repository.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is missing in .env; run make env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      # Substituted into the realm file when it is imported (the API client's secret).
      AGILINA_KEYCLOAK_API_SECRET: ${AGILINA_KEYCLOAK_API_SECRET:?AGILINA_KEYCLOAK_API_SECRET is missing in .env; run make env}
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    # The image has no curl: the readiness probe on the management port is read with bash.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Web client for the database: http://localhost:5051. It signs in with the pgAdmin account
  # of the .env and comes with the Agilina server already registered, password included.
  # Published on localhost only: it can read and change the whole database.
  pgadmin:
    image: dpage/pgadmin4:9.12
    container_name: agilina-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_ADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_ADMIN_PASSWORD:?PGADMIN_ADMIN_PASSWORD is missing in .env; run make env}
      PGADMIN_DISABLE_POSTFIX: "true"
      # With "PassFile" in servers.json this is what lets pgAdmin connect without asking for
      # the password: tested from an empty volume, either one alone makes it ask.
      PGPASSFILE: /pgpass
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5051}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
      - source: pgadmin-passfile
        target: /pgpass
        uid: "5050"  # the user pgAdmin runs as
        gid: "5050"
        mode: 0400  # libpq ignores a password file that others can read
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Catches every email the application sends: nothing leaves the machine.
  # SMTP on :1025, inbox on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: agilina-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    <<: *python-dev
    container_name: agilina-api
    command:
      - uvicorn
      - agilina_api.bootstrap.app:app
      - --reload
      - --reload-dir=/app/api/src
      - --reload-dir=/app/shared/src
      - --host=0.0.0.0
      - --port=8000
    environment:
      # Inside the compose network the services are reached by name, not localhost.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      AGILINA_KEYCLOAK_URL: http://keycloak:8080
      AGILINA_STT_URL: http://stt:8001
    ports:
      - "${AGILINA_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../web
      target: dev
    container_name: agilina-web
    # Rendered into config.json at startup. Only what the browser may see: the web
    # never gets the whole .env, which holds secrets.
    environment:
      AGILINA_API_PUBLIC_URL: ${AGILINA_API_PUBLIC_URL:?AGILINA_API_PUBLIC_URL is missing in .env}
      AGILINA_KEYCLOAK_URL: ${AGILINA_KEYCLOAK_URL:?AGILINA_KEYCLOAK_URL is missing in .env}
      AGILINA_KEYCLOAK_REALM: ${AGILINA_KEYCLOAK_REALM:?AGILINA_KEYCLOAK_REALM is missing in .env}
      AGILINA_KEYCLOAK_WEB_CLIENT: ${AGILINA_KEYCLOAK_WEB_CLIENT:?AGILINA_KEYCLOAK_WEB_CLIENT is missing in .env}
      AGILINA_LOG_LEVEL: ${AGILINA_LOG_LEVEL:-INFO}
    ports:
      - "4200:4200"
    volumes:
      - ../web/src:/app/src
      - ../web/public:/app/public

  stt:
    <<: *python-dev
    container_name: agilina-stt
    profiles: ["voice"]
    command:
      - uvicorn
      - agilina_stt.main:app
      - --reload
      - --reload-dir=/app/stt/src
      - --reload-dir=/app/shared/src
      - --host=0.0.0.0
      - --port=8001
    ports:
      - "8001:8001"

  agent:
    <<: *python-dev
    container_name: agilina-agent
    profiles: ["voice"]
    command: ["python", "-m", "agilina_agent.main", "dev"]
    environment:
      AGILINA_API_PUBLIC_URL: http://api:8000
      AGILINA_STT_URL: http://stt:8001
      AGILINA_KEYCLOAK_URL: http://keycloak:8080

  # One-off containers: `make test`, `make lint`, `make verify`...
  # Unit tests run with --no-deps; the integration tests start Postgres through depends_on.
  tools:
    <<: *python-dev
    profiles: ["tools"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # For `make test-keycloak`; the other tests never look at it.
      AGILINA_KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      postgres:
        condition: service_healthy

  web-test:
    build:
      context: ../web
      target: test
    profiles: ["tools"]
    volumes:
      - ../web/src:/app/src
      - ../web/public:/app/public

# Generated from the .env at startup: the server list pgAdmin loads the first time it runs
# (only then: later changes to POSTGRES_* need an empty pgadmin-data volume) and the password
# file libpq reads through PGPASSFILE.
configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Agilina",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB:-agilina}",
            "Username": "${POSTGRES_USER:-agilina}",
            "SSLMode": "prefer",
            "PassFile": "/pgpass"
          }
        }
      }
  pgadmin-passfile:
    content: |
      postgres:5432:*:${POSTGRES_USER:-agilina}:${POSTGRES_PASSWORD}

volumes:
  postgres-data:
  keycloak-data:
  pgadmin-data:
