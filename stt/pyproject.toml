[project]
name = "agilina-stt"
version = "0.1.0"
description = "Servicio de transcripción con faster-whisper sobre GPU"
requires-python = ">=3.12"
dependencies = [
    "agilina-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# El modelo pesa y solo hace falta donde hay GPU: `uv sync --package agilina-stt --extra gpu`.
# En local y en el pipeline se usa el modo simulado, que no lo instala.
gpu = ["faster-whisper>=1.0"]

[tool.uv.sources]
agilina-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agilina_stt"]
