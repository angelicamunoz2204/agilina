# Included by every location that sets its own headers: in nginx an `add_header`
# inside a location replaces the ones declared at the server level, so these must be
# repeated there. `no-referrer` keeps the activation token (in the URL fragment) from
# ever leaking through the Referer header (HU-02).
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
