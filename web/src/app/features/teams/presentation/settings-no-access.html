<div
  class="rounded-2xl border border-border bg-surface p-6 text-center shadow-sm sm:p-8"
  *transloco="let t; prefix: 'teams.settings'"
>
  <h1 class="font-display text-xl font-semibold" data-testid="settings-forbidden-title">
    {{ t('forbidden.title') }}
  </h1>
  <p class="mt-2 text-sm text-muted">{{ text() }}</p>
  <a aglButton variant="secondary" class="mt-6" [routerLink]="tenant.path('teams', teamId())">
    {{ t('back') }}
  </a>
</div>
