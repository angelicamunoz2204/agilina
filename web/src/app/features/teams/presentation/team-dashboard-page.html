<section class="mx-auto w-full max-w-5xl" *transloco="let t; prefix: 'teams.dashboard'">
  @if (team(); as team) {
    <h1 class="font-display text-3xl font-bold tracking-tight break-words" data-testid="team-name">
      {{ team.name }}
    </h1>
  } @else if (loading()) {
    <p role="status" class="text-sm text-muted">{{ t('loading') }}</p>
  } @else if (problemMessage(); as message) {
    <p role="alert" class="text-sm text-danger">{{ t(message) }}</p>
  }
</section>
