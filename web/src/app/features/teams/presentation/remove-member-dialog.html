<agl-dialog labelledBy="remove-member-title" (dismissed)="dismissed.emit()">
  <ng-container *transloco="let t; prefix: 'teams.settings.remove'">
    <h2 id="remove-member-title" class="font-display text-lg font-semibold break-words">
      {{ t('title', { name: member().fullName }) }}
    </h2>
    <p class="mt-3 text-sm">{{ t('warning', { name: member().fullName }) }}</p>
    <p class="mt-2 text-sm text-muted">{{ t('account_kept') }}</p>

    @if (problem(); as message) {
      <p role="alert" class="mt-4 text-sm text-danger">{{ t(message) }}</p>
    }

    <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <button aglButton variant="secondary" type="button" (click)="dismissed.emit()">
        {{ t('cancel') }}
      </button>
      <button
        aglButton
        variant="danger"
        type="button"
        [disabled]="saving()"
        (click)="confirmed.emit()"
      >
        {{ saving() ? t('saving') : t('confirm') }}
      </button>
    </div>
  </ng-container>
</agl-dialog>
