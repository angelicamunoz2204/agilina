<main
  class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-12"
  *transloco="let t; prefix: 'app'"
>
  <div
    aria-hidden="true"
    class="pointer-events-none absolute -top-40 left-1/2 size-168 -translate-x-1/2 rounded-full bg-accent/15 blur-3xl"
  ></div>

  <div class="relative w-full max-w-md">
    <div class="mb-8 flex flex-col items-center text-center">
      <span
        class="flex size-12 items-center justify-center rounded-2xl bg-accent text-accent-foreground"
      >
        <!-- Lucide "bot" icon. -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-6"
          aria-hidden="true"
        >
          <path d="M12 8V4H8" />
          <rect width="16" height="12" x="4" y="8" rx="2" />
          <path d="M2 14h2" />
          <path d="M20 14h2" />
          <path d="M15 13v2" />
          <path d="M9 13v2" />
        </svg>
      </span>
      <p class="mt-4 font-display text-3xl font-bold tracking-tight">{{ brand }}</p>
      <p class="mt-1 text-sm text-muted">{{ t('tagline') }}</p>
    </div>

    <router-outlet />
  </div>
</main>
