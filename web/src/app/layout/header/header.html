<header
  class="sticky top-0 z-30 flex flex-wrap items-center justify-between gap-x-4 gap-y-2 border-b border-border bg-background/85 px-6 py-3 backdrop-blur"
  *transloco="let t; prefix: 'app'"
>
  <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
    <span class="flex items-center gap-2">
      <span
        class="flex size-9 items-center justify-center rounded-xl bg-accent text-accent-foreground"
        aria-hidden="true"
      >
        <!-- Lucide "bot" icon. -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
        >
          <path d="M12 8V4H8" />
          <rect width="16" height="12" x="4" y="8" rx="2" />
          <path d="M2 14h2" />
          <path d="M20 14h2" />
          <path d="M15 13v2" />
          <path d="M9 13v2" />
        </svg>
      </span>
      <span class="font-display text-lg font-bold tracking-tight">{{ brand }}</span>
    </span>
    @if (team(); as team) {
      <span class="text-muted" aria-hidden="true">/</span>
      <span class="text-sm font-medium break-words" data-testid="header-team">{{ team.name }}</span>
      <span
        class="inline-flex items-center rounded-md bg-accent/10 px-2.5 py-0.5 text-xs font-semibold text-accent"
        data-testid="header-role-label"
      >
        {{ t('role_labels.' + team.roleLabel) }}
      </span>
    } @else {
      <span class="text-sm text-muted">{{ t('tagline') }}</span>
    }
  </div>
  @if (team(); as team) {
    <div class="flex items-center gap-2" data-testid="header-user">
      <span
        class="flex size-8 items-center justify-center rounded-full bg-accent/10 text-xs font-semibold text-accent"
        aria-hidden="true"
        data-testid="header-user-initials"
      >
        {{ initials() }}
      </span>
      <span class="text-sm font-medium break-words" data-testid="header-user-name">{{
        team.userName
      }}</span>
    </div>
  }
</header>
