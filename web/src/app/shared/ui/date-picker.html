<button
  type="button"
  class="flex min-h-11 w-full cursor-pointer items-center justify-between gap-2 rounded-md border border-border bg-transparent px-3 py-2 text-left text-foreground shadow-sm focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-accent aria-invalid:border-danger"
  aria-haspopup="dialog"
  [id]="inputId()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="open() ? dialogId() : null"
  [attr.aria-invalid]="invalid()"
  [attr.aria-describedby]="describedByIds()"
  [attr.data-testid]="testId()"
  [attr.data-value]="value()"
  (click)="toggle()"
  (blur)="onTriggerBlur()"
>
  <span [id]="valueId()" [class.text-muted]="value() === ''">
    {{ value() === '' ? placeholder() : displayValue() }}
  </span>
  <!-- Lucide "calendar" icon. -->
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="size-5 shrink-0 text-muted"
    aria-hidden="true"
  >
    <path d="M8 2v4" />
    <path d="M16 2v4" />
    <rect width="18" height="18" x="3" y="4" rx="2" />
    <path d="M3 10h18" />
  </svg>
</button>

@if (open()) {
  <div
    role="dialog"
    class="absolute top-full left-0 z-20 mt-2 w-[22rem] max-w-[calc(100vw-2rem)] rounded-xl border border-border bg-surface p-4 text-foreground shadow-lg"
    [id]="dialogId()"
    [attr.aria-labelledby]="titleId()"
    (keydown)="onDialogKeydown($event)"
  >
    <div class="mb-3 flex items-center justify-between gap-2">
      <button
        type="button"
        class="flex size-10 cursor-pointer items-center justify-center rounded-lg text-muted hover:bg-accent/10 hover:text-foreground focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-accent"
        [attr.aria-label]="previousMonthLabel()"
        (click)="showMonth(-1)"
      >
        <!-- Lucide "chevron-left" icon. -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
          aria-hidden="true"
        >
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>
      <h2
        class="font-display text-base font-semibold first-letter:uppercase"
        aria-live="polite"
        [id]="titleId()"
      >
        {{ monthTitle() }}
      </h2>
      <button
        type="button"
        class="flex size-10 cursor-pointer items-center justify-center rounded-lg text-muted hover:bg-accent/10 hover:text-foreground focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-accent"
        [attr.aria-label]="nextMonthLabel()"
        (click)="showMonth(1)"
      >
        <!-- Lucide "chevron-right" icon. -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
          aria-hidden="true"
        >
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </div>

    <table role="grid" class="w-full border-collapse" [attr.aria-labelledby]="titleId()">
      <thead>
        <tr>
          @for (weekday of weekdays(); track $index) {
            <th
              scope="col"
              class="pb-2 text-center text-xs font-medium text-muted"
              [attr.abbr]="weekday.long"
            >
              {{ weekday.short }}
            </th>
          }
        </tr>
      </thead>
      <tbody>
        @for (week of weeks(); track $index) {
          <tr>
            @for (cell of week; track $index) {
              <td class="p-0.5 text-center" [attr.aria-selected]="cell?.selected ?? null">
                @if (cell) {
                  <button
                    type="button"
                    class="mx-auto flex size-10 cursor-pointer items-center justify-center rounded-lg text-sm focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-accent aria-disabled:cursor-not-allowed aria-disabled:opacity-40"
                    [class]="cell.tone"
                    [attr.data-date]="cell.date"
                    [attr.aria-label]="cell.name"
                    [attr.aria-current]="cell.today ? 'date' : null"
                    [attr.aria-disabled]="cell.disabled || null"
                    [tabindex]="cell.date === tabbableDate() ? 0 : -1"
                    (click)="pick(cell)"
                  >
                    {{ cell.day }}
                  </button>
                }
              </td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
}
