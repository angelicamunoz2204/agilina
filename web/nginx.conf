# Serves the Angular build. The API and Keycloak URLs come from config.json,
# rendered from the environment at startup (see the Dockerfile); when they are
# relative paths (/api, /auth) the deployment's reverse proxy routes them (HU-38).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The index must never be cached: it points to the hashed bundles.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Runtime config: rendered per environment, so it is never cached.
    location = /config.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        alias /etc/nginx/runtime/config.json;
    }

    # Translation catalogs are not hashed: revalidate them on every load.
    location /i18n/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Hashed bundles are immutable.
    location ~* \.(?:js|css|svg|ico|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page application: any other route is handled by the Angular router.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
