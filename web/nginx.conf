# Serves the Angular build. The routes /api and /auth (API and Keycloak, see
# src/environments/environment.ts) are proxied by the deployment's reverse proxy
# (HU-38), not here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The index must never be cached: it points to the hashed bundles.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Hashed bundles are immutable.
    location ~* \.(?:js|css|svg|ico|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page application: any other route is handled by the Angular router.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
