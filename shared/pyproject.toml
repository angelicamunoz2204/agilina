[project]
name = "agilina-shared"
version = "0.1.0"
description = "Domain models and contract shared between the API and the worker"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agilina_shared"]
