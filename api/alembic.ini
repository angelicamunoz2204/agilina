# Agilina database migrations.
# Two Alembic environments (AD-29), one per kind of database:
#   tenant    the schema of a tenant's database (identity, teams): applied to each tenant's own
#             database, which `python -m agilina_api.bootstrap.migrate` (make migrate) walks.
#   platform  the schema of the catalog (the tenants and the scheduler's jobs).
# The URL is never written here: the caller passes it (see shared/infrastructure/migrations.py).
#
#   alembic -n tenant revision -m "..."      (make migration)
#   alembic -n platform revision -m "..."    (make migration-platform)

[tenant]
script_location = migrations/tenant
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[platform]
script_location = migrations/platform
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
