[project]
name = "agilina-api"
version = "0.1.0"
description = "Agilina API: source of truth of the domain, closing-time reasoning and scheduler"
requires-python = ">=3.12"
dependencies = [
    "agilina-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Installed when the story that needs them arrives, not before.
integraciones = ["openpyxl>=3.1"]

[tool.uv.sources]
agilina-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agilina_api"]
