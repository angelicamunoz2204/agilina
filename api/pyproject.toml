[project]
name = "agilina-api"
version = "0.1.0"
description = "API de Agilina: fuente de verdad del dominio, razonamiento al cierre y planificador"
requires-python = ">=3.12"
dependencies = [
    "agilina-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Se instalan cuando toque la historia que los necesita, no antes.
integraciones = ["httpx>=0.27", "openpyxl>=3.1"]

[tool.uv.sources]
agilina-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agilina_api"]
