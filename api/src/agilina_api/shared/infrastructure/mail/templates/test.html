{% extends "layout.html" %}
{% block content %}
<h1 class="t-fg" style="margin:0 0 12px 0;font-family:{{ fonts.heading }};font-size:22px;line-height:28px;font-weight:700;color:{{ c.foreground }};">{{ t.title }}</h1>
<p class="t-muted" style="margin:0 0 24px 0;color:{{ c.muted_foreground }};">{{ t.intro }}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="panel" style="background-color:{{ c.muted }};border:1px solid {{ c.border }};border-radius:12px;">
  <tr>
    <td colspan="2" class="t-primary" style="padding:16px 16px 6px 16px;font-family:{{ fonts.heading }};font-size:12px;line-height:16px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:{{ c.primary }};">{{ t.details }}</td>
  </tr>
  <tr>
    <td class="t-muted" style="padding:6px 8px 6px 16px;font-size:14px;line-height:20px;color:{{ c.muted_foreground }};white-space:nowrap;" valign="top">{{ t.server }}</td>
    <td class="t-fg" style="padding:6px 16px 6px 8px;font-size:14px;line-height:20px;color:{{ c.foreground }};word-break:break-all;" valign="top">{{ server }}</td>
  </tr>
  <tr>
    <td class="t-muted" style="padding:6px 8px 6px 16px;font-size:14px;line-height:20px;color:{{ c.muted_foreground }};white-space:nowrap;" valign="top">{{ t.security }}</td>
    <td class="t-fg" style="padding:6px 16px 6px 8px;font-size:14px;line-height:20px;color:{{ c.foreground }};" valign="top">{{ t['security_' ~ security] }}</td>
  </tr>
  <tr>
    <td class="t-muted" style="padding:6px 8px 16px 16px;font-size:14px;line-height:20px;color:{{ c.muted_foreground }};white-space:nowrap;" valign="top">{{ t.sender }}</td>
    <td class="t-fg" style="padding:6px 16px 16px 8px;font-size:14px;line-height:20px;color:{{ c.foreground }};word-break:break-all;" valign="top">{{ sender }}</td>
  </tr>
</table>
{% endblock %}
