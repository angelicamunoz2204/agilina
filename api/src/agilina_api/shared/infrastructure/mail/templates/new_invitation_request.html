{% extends "layout.html" %}
{% block content %}
<h1 class="t-fg" style="margin:0 0 16px 0;font-family:{{ fonts.heading }};font-size:22px;line-height:28px;font-weight:700;color:{{ c.foreground }};">{{ t.title }}</h1>
<p class="t-fg" style="margin:0 0 8px 0;color:{{ c.foreground }};">{{ t.greeting }}</p>
<p class="t-muted" style="margin:0 0 20px 0;color:{{ c.muted_foreground }};">{{ t.intro }}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="panel" style="background-color:{{ c.muted }};border:1px solid {{ c.border }};border-radius:12px;">
  <tr>
    <td class="t-fg" style="padding:14px 16px;font-size:14px;line-height:20px;color:{{ c.foreground }};">{{ t['reason_' ~ reason] }}</td>
  </tr>
</table>
<p class="t-muted" style="margin:20px 0 0 0;color:{{ c.muted_foreground }};">{{ t.action }}</p>
{% endblock %}
